name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Concurrency is intentionally job-level, not workflow-level. A workflow-
# level cancellable group would also cancel the `release` job mid-flight if
# a second push to `main` arrived — semantic-release would have created the
# tag and GitHub Release, but binary assets and the Homebrew bump would
# never run, leaving a half-published release. Job-level groups let verify
# stay cancellable while release queues.

jobs:
  verify:
    # Skip the bot-authored bump commit's `[skip ci]` push. PR runs always go
    # through (no `head_commit` on pull_request events; gating on event_name
    # avoids the null-deref that would otherwise prevent the job scheduling).
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Verify
    runs-on: macos-latest
    permissions:
      contents: read
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-llvm-cov

      - name: Verify
        run: scripts/verify.sh --full

  # Push-to-main release. semantic-release decides the next version from
  # Conventional Commits since the last `v*` tag and creates a draft GitHub
  # Release. We build and
  # attest dual-arch macOS tarballs before publishing the immutable release,
  # then bump the Homebrew formula on uinaf/homebrew-tap.
  #
  # Mirrors the shape used by uinaf/react-json-logic.
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Release
    needs: [verify]
    runs-on: macos-latest
    environment:
      name: release
      deployment: false
    permissions:
      attestations: write
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    # Expose the finalized release so the downstream `update-homebrew-tap` job
    # (on ubuntu, since Docker actions do not run on macOS) starts only after
    # GitHub confirms the immutable release.
    outputs:
      release_ready: ${{ steps.finalized.outputs.ready }}
      new_release_version: ${{ steps.release-target.outputs.version }}
      new_release_git_tag: ${{ steps.release-target.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            tccutil-rs
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git

      - name: Install Rust toolchain (from rust-toolchain.toml + darwin cross-compile targets)
        # `rustup show` installs the channel pinned in rust-toolchain.toml
        # from that file. The `target add` calls then attach the cross-compile
        # targets to that *same* pinned toolchain — using
        # dtolnay/rust-toolchain@stable here would install targets onto a
        # different toolchain (stable) than the one cargo actually uses
        # when it sees rust-toolchain.toml, which silently fails the build.
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node (for semantic-release plugins)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/exec@7.1.0
            @jno21/semantic-release-github-commit@1.0.1
            @semantic-release/github@12.0.8
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}

      - name: Resolve release target
        id: release-target
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          NEW_RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag="$NEW_RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            draft_tags="$(
              gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.draft) | .tag_name' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
            )"
            draft_count="$(printf '%s\n' "$draft_tags" | awk 'NF { count++ } END { print count + 0 }')"
            if (( draft_count > 1 )); then
              echo "multiple draft releases require maintainer resolution" >&2
              exit 1
            fi
            if (( draft_count == 1 )); then
              tag="$(printf '%s\n' "$draft_tags" | awk 'NF { print; exit }')"
            else
              while IFS= read -r candidate; do
                candidate_commit="$(git rev-parse "${candidate}^{commit}")"
                candidate_parent="$(git rev-parse "${candidate}^{commit}^" 2>/dev/null || true)"
                if [[ "$candidate_commit" == "$GITHUB_SHA" || "$candidate_parent" == "$GITHUB_SHA" ]]; then
                  tag="$candidate"
                  break
                fi
              done < <(git tag --merged origin/main --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            fi
          fi
          if [[ -z "$tag" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unsupported release tag: $tag" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "release tag is not on origin/main: $tag" >&2
            exit 1
          fi
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "present=true"
            echo "published=$([[ "$is_draft" == "false" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Build dual-arch macOS binaries
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package release artifacts
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release-target.outputs.version }}
        run: |
          mkdir -p dist/arm64 dist/amd64
          cp target/aarch64-apple-darwin/release/tccutil-rs dist/arm64/tccutil-rs
          cp target/x86_64-apple-darwin/release/tccutil-rs dist/amd64/tccutil-rs
          chmod +x dist/arm64/tccutil-rs dist/amd64/tccutil-rs

          tar -C dist/arm64 -czf "tccutil-rs-${RELEASE_VERSION}-darwin-arm64.tar.gz" tccutil-rs
          tar -C dist/amd64 -czf "tccutil-rs-${RELEASE_VERSION}-darwin-amd64.tar.gz" tccutil-rs

          shasum -a 256 \
            "tccutil-rs-${RELEASE_VERSION}-darwin-arm64.tar.gz" \
            "tccutil-rs-${RELEASE_VERSION}-darwin-amd64.tar.gz" \
            > checksums.txt
          shasum -a 256 -c checksums.txt

      - name: Attach assets to GitHub Release
        # Clobber is limited to the mutable draft so a partial upload can retry.
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            tccutil-rs-*-darwin-arm64.tar.gz \
            tccutil-rs-*-darwin-amd64.tar.gz \
            checksums.txt \
            --clobber

      - name: Verify draft asset manifest
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          set -euo pipefail
          asset_count="$(
            gh release view "$RELEASE_TAG" --json assets \
              --jq '[.assets[].name | select(test("^(tccutil-rs-[0-9]+\\.[0-9]+\\.[0-9]+-darwin-(arm64|amd64)\\.tar\\.gz|checksums\\.txt)$"))] | length'
          )"
          if [[ "$asset_count" != "3" ]]; then
            echo "expected two darwin archives and checksums.txt, found $asset_count matching assets" >&2
            exit 1
          fi

      - name: Attest build provenance
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            tccutil-rs-*-darwin-arm64.tar.gz
            tccutil-rs-*-darwin-amd64.tar.gz

      - name: Publish verified draft
        if: steps.release-target.outputs.present == 'true' && steps.release-target.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify immutable release
        if: steps.release-target.outputs.present == 'true'
        id: finalized
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release-target.outputs.tag }}
        run: |
          for attempt in {1..12}; do
            if gh release verify "$RELEASE_TAG"; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( attempt == 12 )); then
              exit 1
            fi
            sleep 5
          done

  update-homebrew-tap:
    if: needs.release.outputs.release_ready == 'true'
    name: Update Homebrew tap
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_RELEASE_APP_PRIVATE_KEY }}
          owner: uinaf
          repositories: |
            tccutil-rs
            homebrew-tap
          permission-contents: write

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: uinaf/homebrew-tap
          token: ${{ steps.release-bot.outputs.token }}
          path: homebrew-tap
          persist-credentials: false
          ref: main

      - name: Prepare formula
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          arm64="tccutil-rs-${VERSION}-darwin-arm64.tar.gz"
          amd64="tccutil-rs-${VERSION}-darwin-amd64.tar.gz"
          gh release download "v${VERSION}" --repo uinaf/tccutil-rs \
            --pattern "$arm64" --pattern "$amd64" --dir "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            "https://github.com/uinaf/tccutil-rs/archive/refs/tags/v${VERSION}.tar.gz" \
            --output "$RUNNER_TEMP/source.tar.gz"
          source_sha="$(sha256sum "$RUNNER_TEMP/source.tar.gz" | awk '{print $1}')"
          arm64_sha="$(sha256sum "$RUNNER_TEMP/$arm64" | awk '{print $1}')"
          amd64_sha="$(sha256sum "$RUNNER_TEMP/$amd64" | awk '{print $1}')"
          SOURCE_SHA="$source_sha" ARM64_SHA="$arm64_sha" AMD64_SHA="$amd64_sha" ruby -e '
            path = ARGV.fetch(0)
            version = ENV.fetch("VERSION")
            text = File.read(path)
            previous = text[/archive\/refs\/tags\/v([^\"]+)\.tar\.gz/, 1] or abort "source URL not found"
            text.gsub!(previous, version)
            text.sub!(/(archive\/refs\/tags\/v[^\"]+\.tar\.gz"\n\s+sha256 ")[0-9a-f]+/, "\\1#{ENV.fetch("SOURCE_SHA")}") or abort "source sha not found"
            text.sub!(/(darwin-amd64\.tar\.gz"\n\s+sha256 ")[0-9a-f]+/, "\\1#{ENV.fetch("AMD64_SHA")}") or abort "amd64 sha not found"
            text.sub!(/(darwin-arm64\.tar\.gz"\n\s+sha256 ")[0-9a-f]+/, "\\1#{ENV.fetch("ARM64_SHA")}") or abort "arm64 sha not found"
            File.write(path, text)
          ' homebrew-tap/Formula/tccutil-rs.rb
          grep -F "v${VERSION}.tar.gz" homebrew-tap/Formula/tccutil-rs.rb
          grep -F "tccutil-rs-${VERSION}-darwin-amd64.tar.gz" homebrew-tap/Formula/tccutil-rs.rb
          grep -F "tccutil-rs-${VERSION}-darwin-arm64.tar.gz" homebrew-tap/Formula/tccutil-rs.rb

      - name: Commit formula
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "tccutil-rs ${{ needs.release.outputs.new_release_version }}"
          repo: uinaf/homebrew-tap
          branch: main
          file_pattern: Formula/tccutil-rs.rb
          repository: homebrew-tap
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
